# Cargo configuration for data-commons workspace
# This file provides convenient aliases for common development tasks

[alias]
# SeaORM Migration aliases
migrate-up = "run --manifest-path ./migration/Cargo.toml -- up"
migrate-down = "run --manifest-path ./migration/Cargo.toml -- down"
migrate-status = "run --manifest-path ./migration/Cargo.toml -- status"
migrate-fresh = "run --manifest-path ./migration/Cargo.toml -- fresh"
migrate-reset = "run --manifest-path ./migration/Cargo.toml -- reset"
migrate-generate = [
    "run",
    "--manifest-path",
    "./migration/Cargo.toml",
    "--",
    "generate",
]

# Entity generation using cargo-run-bin
# Generate entities from both schemas
# Note: --max-connections helps avoid pool timeouts on large schemas
generate-entities-discourse = "bin sea-orm-cli generate entity -s discourse -o shared/entities/src/discourse --with-serde both --max-connections 3"
generate-entities-near = "bin sea-orm-cli generate entity -s near -o shared/entities/src/near --with-serde both --max-connections 5"
generate-entities = ["generate-entities-discourse", "generate-entities-near"]

# Development shortcuts
check-all = "check --workspace"
test-all = "test --workspace"
build-all = "build --workspace"
clean-all = "clean --workspace"

# Individual service shortcuts
run-api = "run -p api"
run-discourse-indexer = "run -p discourse-indexer"
run-near-indexer = "run -p near-indexer"
