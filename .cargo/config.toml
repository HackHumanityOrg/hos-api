[alias]
check-all = "check --workspace"
test-all = "test --workspace"
run-api = "run -p api"
run-indexer-1 = "run -p discourse-indexer"
run-indexer-2 = "run -p near-indexer"
run-indexer-3 = "run -p telegram-indexer"
migrate-up = "run -p migration --bin migration -- up"
migrate-down = "run -p migration --bin migration -- down"
migrate-status = "run -p migration --bin migration -- status"
migrate-generate = "run -p migration --bin migration -- generate"
migrate-reset = "run -p migration --bin migration -- reset"
migrate-fresh = "run -p migration --bin migration -- fresh"
generate-entities = "run -p migration --bin generate_entities"
backfill-identity-accounts = "run -p migration --bin backfill_identity_accounts"
test-discourse-indexer = "test -p discourse-indexer -- --test-threads=1"
coverage-discourse-indexer = "llvm-cov -p discourse-indexer --all-features -- --test-threads=1"
