[workspace]
members = [
    "shared/entities",
    "shared/db-core",
    "shared/common",
    "shared/test-support",
    "indexers/discourse-indexer",
    "indexers/near-indexer",
    "api",
    "migration",
]
resolver = "2"

[profile.release]
# Move Docker ENV profile hints into canonical Cargo profiles
codegen-units = 1
lto = true
strip = "symbols"
opt-level = "z"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# Database & ORM (PostgreSQL + PlanetScale Postgres compatible)
sea-orm = { version = "1.1", features = [
    "sqlx-postgres",
    "runtime-tokio-native-tls", # PlanetScale requires SSL/TLS
    "macros",
    "debug-print",              # Enable proper log messages for queries
    "mock",                     # Enable MockDatabase for unit tests
] }
sea-orm-migration = { version = "1", features = [
    "sqlx-postgres",
    "runtime-tokio-native-tls",
    "runtime-tokio-rustls",     # Also include CLI features
] }

# Web framework & OpenAPI
axum = { version = "0.8", features = ["macros"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling (hybrid approach: thiserror for libraries, anyhow for applications)
thiserror = "2.0"
anyhow = "1.0"

# Configuration
figment = { version = "0.10", features = ["toml", "env"] }
dotenvy = "0.15"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# OpenTelemetry Core
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-semantic-conventions = "0.31"
opentelemetry-http = { version = "0.31", features = ["reqwest-rustls-webpki-roots"] }

# OpenTelemetry OTLP Exporter
opentelemetry-otlp = { version = "0.31", features = [
    "http-proto",
    "http-json",
    "reqwest-client",
    "reqwest-rustls-webpki-roots",
    "metrics",
    "logs",
] }

# OpenTelemetry Bridges
tracing-opentelemetry = "0.32"
opentelemetry-appender-tracing = "0.31.1"

# Axum OpenTelemetry Integration
axum-tracing-opentelemetry = "0.32"

# Additional dependencies for telemetry
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Testing
tokio-test = "0.4"
testcontainers = "0.25"
testcontainers-modules = { version = "0.13", features = ["postgres"] }
rstest = "0.26"
axum-test = "18.7"
futures = "0.3"

# Migration specific
async-std = { version = "1", features = ["attributes", "tokio1"] }
common = { path = "shared/common" }
db-core = { path = "shared/db-core" }
entities = { path = "shared/entities" }
migration = { path = "migration" }
mockito = "1.7"
rand = "0.10.0"
reqwest = "0.12"
near-account-id = "2.5.0"
near-lake-framework = "0.7.14"
rust_decimal = "1"
test-support = { path = "shared/test-support" }
async-trait = "0.1"
hex = "0.4"
near-primitives = "0.34.6"
sha2 = "0.10"
near-crypto = "0.34.6"
base64 = "0.22"
wiremock = "0.6"
reqwest-middleware = "0.5"
reqwest-retry = "0.9"
reqwest-tracing = "0.7"
near-indexer-primitives = "0.34.6"
httpdate = "1"
serde_path_to_error = "0.1"
scraper = "0.25.0"

# Development tools (managed by cargo-run-bin)
[workspace.metadata.bin]
sea-orm-cli = { version = "1.1.15" }
