[workspace]
members = [
    "shared/entities",
    "shared/db-core", 
    "shared/common",
    "indexers/indexer-1",
    "indexers/indexer-2", 
    "indexers/indexer-3",
    "api",
    "migration"
]
resolver = "2"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1", features = ["full"] }

# Database & ORM (MySQL + PlanetScale compatible)
sea-orm = { version = "1", features = [
    "sqlx-mysql", 
    "runtime-tokio-native-tls",  # PlanetScale requires SSL/TLS
    "macros",
    "debug-print"  # Enable proper log messages for queries
] }
sea-orm-migration = { version = "1", features = [
    "sqlx-mysql",
    "runtime-tokio-native-tls",
    "runtime-tokio-rustls"  # Also include CLI features
] }

# Web framework & OpenAPI
axum = { version = "0.8", features = ["macros"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling (hybrid approach: thiserror for libraries, anyhow for applications)
thiserror = "2.0"
anyhow = "1.0"

# Configuration
figment = { version = "0.10", features = ["toml", "env"] }
dotenvy = "0.15"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# OpenTelemetry Core  
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-semantic-conventions = "0.27"

# OpenTelemetry OTLP Exporter
opentelemetry-otlp = { version = "0.27", features = ["http-proto", "http-json", "reqwest-client", "reqwest-rustls-webpki-roots", "metrics", "logs"] }

# OpenTelemetry Bridges
tracing-opentelemetry = "0.28"
opentelemetry-appender-tracing = "0.27"

# Axum OpenTelemetry Integration
axum-tracing-opentelemetry = "0.24"

# Additional dependencies for telemetry
tonic = "0.12"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Testing
tokio-test = "0.4"
testcontainers = "0.25"
testcontainers-modules = { version = "0.13", features = ["mysql"] }
rstest = "0.26"
axum-test = "18.0"
httpc-test = "0.1"
futures = "0.3"

# Migration specific
async-std = { version = "1", features = ["attributes", "tokio1"] }

# Development tools (managed by cargo-run-bin)
[workspace.metadata.bin]
sea-orm-cli = { version = "1.1.15" }
