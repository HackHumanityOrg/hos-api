[build]
builder = "DOCKERFILE"
dockerfilePath = "indexers/indexer-3/Dockerfile"
watchPaths = [
    "indexers/indexer-3/**",
    "shared/**",
    "migration/**",
    "Cargo.toml",
    "Cargo.lock",
]

[deploy]
startCommand = "/indexer-3"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Railway environment configuration
[deploy.env]
RUST_LOG = "warn"
INDEXER_NAME = "indexer-3"
