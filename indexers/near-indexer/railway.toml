[build]
builder = "DOCKERFILE"
dockerfilePath = "indexers/near-indexer/Dockerfile"
watchPatterns = [
  "indexers/near-indexer/**",
  "shared/**",
  "migration/**",
  "Cargo.toml",
  "Cargo.lock"
]

[deploy]
startCommand = "/near-indexer"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[deploy.env]
RUST_LOG = "debug"
