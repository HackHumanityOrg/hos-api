# NEAR Indexer Configuration
# Database URL comes from DATABASE_URL environment variable

[database]
# DATABASE_URL is loaded from environment variable
# Connection pool and timeout settings - optimized for concurrent processing
max_connections = 150       # Increased from 10 to handle concurrent blocks
min_connections = 10        # Increased from 1 for ready connections
connection_timeout = 15     # Reduced from 30 to fail faster
acquire_timeout = 5         # Reduced from 30 to prevent pile-ups
idle_timeout = 120          # Reduced from 600 to force connection recycling
max_lifetime = 300          # Reduced from 1800 to prevent stale connections

[logging]
level = "info"
format = "pretty"

[telemetry]
enabled = true
service_version = "0.1.0"
environment = "development"
enable_metrics = true
enable_traces = true
enable_logs = true
batch_size = 256
export_timeout_sec = 10
export_interval_sec = 10

[telemetry.resource_attributes]
"service.namespace" = "data-commons"
"service.component" = "near-indexer"
"deployment.region" = "local"
"indexer.type" = "primary"

[near]
# Chain to index: "mainnet", "testnet", or "disabled"
chain = "mainnet"
# Starting block height (0 for genesis, or specific height)
start_height = 0
# Concurrency for parallel block processing (number of blocks to process simultaneously)
# Reduced from 20 to 4 to prevent database connection exhaustion
concurrency = 4

# Module configurations
[near.modules.accounts]
enabled = true
# Track implicit accounts (64-char hex addresses)
track_implicit = true
# Track ETH-implicit accounts (Ethereum-style addresses)
track_eth_implicit = true

[near.modules.tokens]
enabled = true
# Track NEP-141 fungible tokens
track_nep141 = true
# Track NEP-171 NFTs
track_nep171 = true
# Track NEP-245 MultiToken
track_nep245 = true
# List of specific contracts to track (empty = track all)
contracts = []

[near.modules.validators]
enabled = true

[near.modules.validators.rpc_updater]
enabled = true
rpc_url = "https://free.rpc.fastnear.com"
update_interval_minutes = 60

# Retry configuration for RPC requests
[near.modules.validators.rpc_updater.retry]
max_retries = 5
initial_backoff_ms = 100
max_backoff_ms = 60000
multiplier = 2.0
jitter = true

# Rate limiting configuration
[near.modules.validators.rpc_updater.rate_limit]
requests_per_second = 10
burst_size = 20
honor_server_headers = true

[near.modules.network]
enabled = true
