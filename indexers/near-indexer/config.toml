# NEAR Indexer Configuration
# Database URL comes from DATABASE_URL environment variable

[database]
# DATABASE_URL is loaded from environment variable
# Connection pool and timeout settings - optimized for concurrent processing
max_connections = 150       # Increased from 10 to handle concurrent blocks
min_connections = 10        # Increased from 1 for ready connections
connection_timeout = 15     # Reduced from 30 to fail faster
acquire_timeout = 5         # Reduced from 30 to prevent pile-ups
idle_timeout = 120          # Reduced from 600 to force connection recycling
max_lifetime = 300          # Reduced from 1800 to prevent stale connections

[logging]
level = "info"
format = "json"

[telemetry]
enabled = true
service_version = "0.1.0"
environment = "development"
enable_traces = true
enable_logs = true
traces_sample_rate = 1.0
event_sample_rate = 1.0
shutdown_timeout_sec = 2
send_default_pii = true

[telemetry.tags]
"service.namespace" = "data-commons"
"service.component" = "near-indexer"
"deployment.region" = "local"
"indexer.type" = "primary"

[near]
# Stream provider: "lake" (AWS S3) or "fastnear" (HTTP API)
provider = "fastnear"
# Chain to index: "mainnet", "testnet", or "disabled"
chain = "mainnet"
# Starting block height (0 for genesis)
start_height = 158320040
# Concurrency for parallel block processing (number of blocks to process simultaneously)
# Keep at 1 for deterministic cumulative veNEAR balances
concurrency = 1
# Limit NEAR Lake prefetch to avoid unbounded upstream buffering and memory growth
# Keep this small (1–2) unless you’ve verified DB can keep up
preload_pool_size = 8
# FastNEAR-only fetch thread count (ignored when provider = "lake")
# Lower value reduces aggressive parallel fetch/retry pressure during backfill
fastnear_num_threads = 8
# Optional FastNEAR token (prefer env override APP_NEAR__FASTNEAR_API_KEY)
# fastnear_api_key = ""

# Module configurations

# Raw data module - stores full NEAR blockchain payloads.
[near.modules.raw]
enabled = false
# Stream mode: "shared" (default) or "independent"
stream_mode = "shared"
start_height = 0

# veNEAR governance raw module - stores only HOS-related rows in shared raw projection tables.
[near.modules.venear_governance]
enabled = true
stream_mode = "shared"
start_height = 158320040
# Refresh HoS materialized views every N blocks (0 disables auto-refresh).
mview_refresh_interval_blocks = 100
# Garbage-collect finalized/pruned tx-state rows every N blocks.
staging_gc_interval_blocks = 600
# Max rows deleted per staging table per cleanup batch.
staging_gc_batch_size = 5000
# Max cleanup batches per run (caps delete work during a single block).
staging_gc_max_batches_per_run = 50
# Cleanup cadence for receipt->tx lineage map when raw is disabled (0 disables).
receipt_tx_map_cleanup_interval_blocks = 600
# Keep lineage for this many blocks before pruning non-HoS entries.
receipt_tx_map_retention_blocks = 86400
# Max lineage-map rows deleted per cleanup batch.
receipt_tx_map_cleanup_batch_size = 5000
# Max lineage-map cleanup batches per run.
receipt_tx_map_cleanup_max_batches_per_run = 50
