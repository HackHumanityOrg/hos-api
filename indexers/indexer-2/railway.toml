[build]
builder = "DOCKERFILE"
dockerfilePath = "indexers/indexer-2/Dockerfile"
watchPaths = [
    "indexers/indexer-2/**",
    "shared/**",
    "migration/**",
    "Cargo.toml",
    "Cargo.lock",
]

[deploy]
startCommand = "/indexer-2"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Railway environment configuration
[deploy.env]
RUST_LOG = "info"
INDEXER_NAME = "indexer-2"
