[build]
builder = "DOCKERFILE"
dockerfilePath = "indexers/indexer-1/Dockerfile"
watchPaths = [
    "indexers/indexer-1/**",
    "shared/**",
    "migration/**",
    "Cargo.toml",
    "Cargo.lock",
]

[deploy]
startCommand = "/indexer-1"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Railway environment configuration
[deploy.env]
RUST_LOG = "debug"
INDEXER_NAME = "indexer-1"
