# Discourse Indexer Configuration
# Database URL comes from DATABASE_URL environment variable

[database]
# DATABASE_URL is loaded from environment variable
# Connection pool and timeout settings - optimized for concurrent processing
max_connections = 100       # Increased from 15 to handle concurrent operations
min_connections = 5         # Increased from 2 for ready connections  
connection_timeout = 15     # Reduced from 30 to fail faster
acquire_timeout = 5         # Reduced from 30 to prevent pile-ups
idle_timeout = 120          # Reduced from 600 to force connection recycling
max_lifetime = 300          # Reduced from 1800 to prevent stale connections

[[discourse.instances]]
key = "NEAR"
base_url = "https://gov.near.org"
enabled = true
max_http_concurrency = 8
max_post_tasks = 5          # Reduced from 10 to decrease database load
likes_concurrency = 5       # Reduced from 10 to prevent deadlocks
revisions_concurrency = 3   # Reduced from 5 to decrease database load
recent_topic_pages_cap = 3
full_refresh_interval_sec = 86400  # 24h for this instance
recent_update_interval_sec = 300   # 5m for this instance

[logging]
level = "debug"
format = "pretty"

[telemetry]
enabled = true
service_version = "0.1.0"
environment = "development"
enable_metrics = true
enable_traces = true
enable_logs = true
batch_size = 256
export_timeout_sec = 10
export_interval_sec = 10

[telemetry.resource_attributes]
"service.namespace" = "data-commons"
"service.component" = "discourse-indexer"
"deployment.region" = "local"
"indexer.type" = "primary"

[discourse]
full_refresh_interval_sec = 86400
recent_update_interval_sec = 900
max_pages_per_run = 1000
recent_lookback_hours = 2
