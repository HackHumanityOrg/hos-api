[build]
builder = "DOCKERFILE"
dockerfilePath = "indexers/discourse-indexer/Dockerfile"
watchPaths = [
  "indexers/discourse-indexer/**",
  "shared/**",
  "migration/**",
  "Cargo.toml",
  "Cargo.lock"
]

[deploy]
startCommand = "/discourse-indexer"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Railway environment configuration
[deploy.env]
RUST_LOG = "debug"
INDEXER_NAME = "discourse-indexer"
