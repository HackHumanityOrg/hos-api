[build]
builder = "DOCKERFILE"
dockerfilePath = "indexers/discourse-indexer/Dockerfile"
watchPatterns = [
  "indexers/discourse-indexer/**",
  "shared/**",
  "migration/**",
  "Cargo.toml",
  "Cargo.lock",
  ".dockerignore"
]

[deploy]
startCommand = "/discourse-indexer"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1

[deploy.multiRegionConfig."us-east4-eqdc4a"]
numReplicas = 1

[deploy.limitOverride.containers]
cpu = 4
memoryBytes = 4000000000
