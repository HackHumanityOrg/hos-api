[database]
# Database URL should be set via DATABASE_URL environment variable
max_connections = 10
min_connections = 1
connection_timeout = 30
acquire_timeout = 30
idle_timeout = 600      # 10 minutes - how long connections can be idle
max_lifetime = 1800     # 30 minutes - maximum lifetime of connections

[server]
host = "127.0.0.1"
port = 3000

[logging]
level = "info"
