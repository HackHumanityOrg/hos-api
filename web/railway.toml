[build]
builder = "DOCKERFILE"
dockerfilePath = "web/Dockerfile"
watchPatterns = [
  "web/**",
  ".dockerignore"
]

[deploy]
startCommand = "node server.js"
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1

[deploy.multiRegionConfig."us-east4-eqdc4a"]
numReplicas = 1
