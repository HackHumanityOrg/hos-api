[build]
builder = "DOCKERFILE"
dockerfilePath = "api/Dockerfile"
watchPaths = [
  "api/**",
  "shared/**",
  "migration/**",
  "Cargo.toml",
  "Cargo.lock"
]

[deploy]
startCommand = "/api-bin"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Railway environment configuration
[deploy.env]
RUST_LOG = "debug"
