[build]
builder = "DOCKERFILE"
dockerfilePath = "api/Dockerfile"
watchPatterns = [
  "api/**",
  "shared/**",
  "migration/**",
  "Cargo.toml",
  "Cargo.lock",
  ".dockerignore"
]

[deploy]
startCommand = "/api-bin"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1

[deploy.multiRegionConfig."us-east4-eqdc4a"]
numReplicas = 1

[deploy.limitOverride.containers]
cpu = 4
memoryBytes = 4000000000
