# API Configuration
# Database URL comes from DATABASE_URL environment variable

[database]
# DATABASE_URL is loaded from environment variable
# Connection pool and timeout settings
max_connections = 20
min_connections = 5
connection_timeout = 30
acquire_timeout = 30  
idle_timeout = 600
max_lifetime = 1800

[server]
host = "0.0.0.0"
port = 3000

[logging]
level = "debug"   # Set to 'debug' for local debugging, 'info' for quieter production logs
format = "json"

[telemetry]
# Telemetry configuration for internal metrics and tracing behavior.
enabled = true
service_version = "0.1.0"
environment = "development" # Options: development, staging, production
enable_traces = true
enable_logs = true
traces_sample_rate = 1.0
event_sample_rate = 1.0
shutdown_timeout_sec = 2
send_default_pii = true

# API-specific tags
[telemetry.tags]
"service.namespace" = "data-commons"
"service.component" = "api"
"deployment.region" = "local"
